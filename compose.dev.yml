name: backend-dkhp

services:
  postgres:
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=100", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dkhp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dkhp_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dkhp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dkhp_user} -d $${POSTGRES_DB:-dkhp_dev}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.migrate"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dkhp_user}:${POSTGRES_PASSWORD:-dkhp_dev_pass}@postgres:5432/${POSTGRES_DB:-dkhp_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --workers
      - "${API_WORKERS:-2}"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dkhp_user}:${POSTGRES_PASSWORD:-dkhp_dev_pass}@postgres:5432/${POSTGRES_DB:-dkhp_dev}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-3.0}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-2000}
      DB_IDEMPOTENCY_LOCK_TIMEOUT_MS: ${DB_IDEMPOTENCY_LOCK_TIMEOUT_MS:-1500}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
      TUITION_PER_CREDIT: ${TUITION_PER_CREDIT:-500000}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_MAX_READY: ${QUEUE_MAX_READY:-100}
      QUEUE_TOKEN_TTL_SECONDS: ${QUEUE_TOKEN_TTL_SECONDS:-300}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/dkhp}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-http://localhost:8081/realms/dkhp/protocol/openid-connect/auth}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-http://keycloak:8080/realms/dkhp/protocol/openid-connect/token}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/dkhp/protocol/openid-connect/certs}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-dkhp-backend}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-keycloak-secret-override-in-env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/sso/callback}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-none}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.1-alpine3.20
    profiles: ["queue", "full"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Không mở Redis ra ngoài Internet; chỉ bind loopback cho phát triển cục bộ
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    profiles: ["sso", "full"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_dev_only}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/dkhp-realm.json:/opt/keycloak/data/import/dkhp-realm.json:ro

volumes:
  pgdata_dev:
