[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dkhp-backend"
version = "1.0.0"
description = "Hệ thống đăng ký học phần trực tuyến (TV2 Backend & Database — Spec v3.0)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "argon2-cffi==25.1.0",
    "redis==5.3.1",
    "PyJWT[crypto]==2.15.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.17.3",
    "pgserver==0.1.4",
    "fakeredis[lua]==2.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
markers = [
    "unit: Kiểm thử đơn vị cho hàm thuần không cần CSDL thật",
    "contract: Kiểm thử hợp đồng HTTP, schema, lỗi, CORS, OpenAPI",
    "integration: Kiểm thử tích hợp nghiệp vụ trên PostgreSQL thật",
    "concurrency: Kiểm thử tranh chấp đồng thời nhiều kết nối / nhiều worker",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM105", "SIM117"]
